<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منارات الجنوب – إدارة المحل</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}

.ch{display:flex;gap:6px}.cl{flex:1;text-align:center}.bs{height:130px;display:flex;gap:3px;align-items:flex-end;justify-content:center}.bs i{width:35%;border-radius:4px 4px 0 0;min-height:2px}

:root{--bg:#eef5fa;--c:#fff;--t:#0b2239;--m:#5b6b80;--b:#dbe6f0;--p:#0891b2;--a:#f5a524}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#06111d;--c:#0d2033;--t:#e6f1fa;--m:#8fa6bd;--b:#1c3550}}:root[data-theme='dark']{--bg:#06111d;--c:#0d2033;--t:#e6f1fa;--m:#8fa6bd;--b:#1c3550}header{position:relative;background:linear-gradient(135deg,#04182b,#0a4f6e 55%,#0e7490);padding:18px 16px 24px}.hd{position:relative;z-index:1}.lg{font-size:24px;letter-spacing:.3px}header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:12px;background:radial-gradient(circle at 10px -3px,transparent 11px,var(--bg) 12px) repeat-x;background-size:20px 12px;animation:wv 2.5s linear infinite}@keyframes wv{to{background-position:20px 0}}.bub{position:absolute;inset:0;overflow:hidden;pointer-events:none}.bub i{position:absolute;bottom:-20px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);animation:rise var(--d) linear infinite}@keyframes rise{to{transform:translateY(-130px);opacity:0}}nav{box-shadow:0 2px 10px rgba(6,36,63,.06)}nav b{transition:color .2s}nav b:hover{color:var(--p)}nav b.on{border-color:var(--a)}.card,.k{border-radius:16px;box-shadow:0 2px 10px rgba(6,36,63,.06);animation:up .5s backwards;transition:transform .2s,box-shadow .2s}.k{border-top:3px solid var(--p)}.k:nth-child(2n){animation-delay:.08s}.k:nth-child(3n){animation-delay:.16s;border-top-color:var(--a)}.k:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(8,145,178,.18)}@keyframes up{from{opacity:0;transform:translateY(14px)}}button{background:linear-gradient(135deg,var(--p),#0e7490);transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(8,145,178,.35)}.bs i{transform-origin:bottom;animation:gr .8s backwards}@keyframes gr{from{transform:scaleY(0)}}.pg{height:8px;background:var(--b);border-radius:6px;overflow:hidden;min-width:90px}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#fcd34d);transform-origin:right;animation:gw 1s backwards}@keyframes gw{from{transform:scaleX(0)}}.bd{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.st0{background:#fef3c7;color:#92400e}.st1{background:#cffafe;color:#155e75}.st2{background:#dcfce7;color:#166534}#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#04182b,#0a4f6e 60%,#0e7490);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:8px;overflow:hidden;transition:opacity .6s,visibility .6s;cursor:pointer}#splash.h{opacity:0;visibility:hidden}#splash h1{margin:0;font-size:34px;animation:pop .8s .5s backwards}#splash p{margin:0;opacity:.85;animation:pop .8s .8s backwards}.car{font-size:70px;animation:drv 1.6s ease-out backwards}@keyframes drv{from{transform:translateX(-110vw)}}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.st3{background:#fee2e2;color:#991b1b}.mx{display:flex;gap:6px;flex-wrap:wrap}.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.qb{display:flex;flex-direction:column;gap:3px;align-items:center;padding:12px 8px;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:12px;font-weight:600}.qb span{color:var(--p);font-weight:800}.qb:hover{border-color:var(--p)}.qb:disabled{opacity:.4;cursor:not-allowed}#sy{cursor:pointer}#lg{position:fixed;inset:0;z-index:98;display:none;align-items:center;justify-content:center;background:linear-gradient(160deg,#04182b,#0a4f6e 60%,#0e7490);padding:16px}#lg .card{width:100%;max-width:360px;margin:0}#lm{color:var(--r);font-size:13px;min-height:18px}</style><link rel='manifest' href='manifest.webmanifest'><meta name='theme-color' content='#0a4f6e'><link rel='icon' href='icon-192.png'><link rel='apple-touch-icon' href='icon-192.png'><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script></head><body>
<div id='splash' onclick="this.classList.add('h')"><div class='bub'><i style='--x:10%;--s:14px;--d:3s'></i><i style='--x:30%;--s:22px;--d:4s'></i><i style='--x:55%;--s:12px;--d:2.6s'></i><i style='--x:75%;--s:26px;--d:4.4s'></i><i style='--x:90%;--s:16px;--d:3.4s'></i></div><div class='car'>🚗</div><h1>منارات الجنوب</h1><p>غسيل • زيوت • بنشر • خدمات</p></div><header><div class='bub'><i style='--x:8%;--s:12px;--d:5s'></i><i style='--x:25%;--s:20px;--d:7s'></i><i style='--x:48%;--s:10px;--d:4.5s'></i><i style='--x:66%;--s:18px;--d:6s'></i><i style='--x:85%;--s:14px;--d:5.5s'></i></div><div class="hd"><div class="lg">🚗 منارات الجنوب<small>غسيل سيارات • زيوت • بنشر • خدمات</small></div><div class="rg" id="rg"></div><div style='width:100%;font-size:12px;display:flex;gap:12px;align-items:center'><span id='sy' onclick='if(sb&&!UID)showLogin()'>● محلي فقط</span><a onclick='out()' style='cursor:pointer;text-decoration:underline'>خروج</a></div></div></header>
<nav id="nv"></nav><main id="mn"></main><div id="ts"></div><div id='lg'><div class='card'><h3>🚗 منارات الجنوب — تسجيل الدخول</h3><label>البريد الإلكتروني<input id='le' type='email' autocomplete='username'></label><label>كلمة المرور<input id='lp' type='password' autocomplete='current-password'></label><div id='lm'></div><div class='row'><button onclick='auth(0)'>دخول</button><button class='gh' onclick='auth(1)'>إنشاء حساب</button></div><small>بياناتك تُحفظ وتتزامن تلقائياً بين كل أجهزتك.</small><p><a style='cursor:pointer;text-decoration:underline;color:var(--m)' onclick="$('#lg').style.display='none'">متابعة بدون حساب (الحفظ على هذا الجهاز فقط)</a></p></div></div>
<script>
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),N=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:2});
const ld=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4),iso=d=>d.toISOString().slice(0,10),TD=()=>iso(ld());
let D=null;try{D=JSON.parse(localStorage.getItem('mj'))}catch(e){}
D=D||{cur:'',seq:100,
svc:[],prd:[],sales:[],exp:[],emp:[],bk:[],rw:{}};norm(D);
function norm(d){d.bk=d.bk||[];d.rw=d.rw||{};['cd','rx','pu','att','adv'].forEach(k=>d[k]=d[k]||[]);return d}
const DEF=['غسيل خارجي','غسيل داخلي وخارجي','تلميع وتنظيف عميق','أجرة تغيير زيت','ترقيع إطار (بنشر)','تركيب وترصيص إطار','زيت محرك 4 لتر','فلتر زيت','ملمّع داخلي'];
function dropDef(d){if(d.cl)return false;d.svc=(d.svc||[]).filter(x=>!(x.id<100&&DEF.includes(x.n)));d.prd=(d.prd||[]).filter(x=>!(x.id<100&&DEF.includes(x.n)));d.cl=1;return true}
let CL=dropDef(D);
let sb=null,REV=-1,UID=null,tm=null,dirty=false,OUT=false,NE='';const DEV=(()=>{try{let v=localStorage.getItem('mdev');if(!v){v=Math.random().toString(36).slice(2);localStorage.setItem('mdev',v)}return v}catch(e){return 'x'}})();const save=()=>{try{localStorage.setItem('mj',JSON.stringify(D))}catch(e){}dirty=true;clearTimeout(tm);tm=setTimeout(()=>push(),700)};
const PM={cash:'نقدي',card:'بطاقة',credit:'آجل'},EC=['إيجار','كهرباء','ماء','إنترنت','رواتب','مستلزمات','مواد تنظيف','تسويق','نقل','أخرى'];
const tot=s=>s.it.reduce((a,i)=>a+i.q*i.p,0),paid=s=>s.pays.reduce((a,p)=>a+p.a,0);
let R={k:'day',f:TD(),t:TD()},T='dash',C=[],SQ='';const inR=d=>d>=R.f&&d<=R.t;
function msg(t){const e=$('#ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function sure(b,f){if(b.dataset.s){f();return}b.dataset.l=b.dataset.l||b.textContent;b.dataset.s=1;b.textContent='تأكيد؟';b.classList.add('rd');setTimeout(()=>{b.dataset.s='';b.textContent=b.dataset.l;b.classList.remove('rd')},3000)}
function setR(k){const n=ld(),y=n.getUTCFullYear(),m=n.getUTCMonth();R.k=k;R.t=TD();
if(k=='day')R.f=R.t;else if(k=='week')R.f=iso(new Date(n-6*864e5));else if(k=='month')R.f=iso(new Date(Date.UTC(y,m,1)));else if(k=='year')R.f=iso(new Date(Date.UTC(y,0,1)));rs()}
function hd(){$('#rg').innerHTML=`<select onchange="setR(this.value)">${[['day','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['year','هذه السنة'],['x','مخصص']].map(o=>`<option value="${o[0]}"${R.k==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select><input type="date" value="${R.f}" onchange="R.f=this.value;R.k='x';hd();rs()"><input type="date" value="${R.t}" onchange="R.t=this.value;R.k='x';hd();rs()">`}
const TB=[['dash','لوحة التحكم'],['pos','فاتورة جديدة'],['sales','المبيعات'],['close','إقفال الصندوق'],['book','الحجوزات'],['cus','العملاء والولاء'],['inv','المخزون والخدمات'],['buy','المشتريات والموردين'],['exp','المصروفات'],['emp','الموظفون والعمولات'],['rep','التقارير'],['set','⚙️ الإعدادات']];
function go(k){T=k;$('#nv').innerHTML=TB.map(t=>`<b class="${t[0]==k?'on':''}" onclick="go('${t[0]}')">${t[1]}</b>`).join('');try{$('#mn').innerHTML=V[k]();if(k=='pos')rc()}catch(e){fail(e)}window.scrollTo(0,0);an()}
function rs(){if(T!='pos'){try{$('#mn').innerHTML=V[T]()}catch(e){fail(e)}}an()}function fail(e){console.error(e);$('#mn').innerHTML='<div class="card"><h3>تعذّر عرض الصفحة</h3><small>'+E(e&&e.message)+'</small><p><button onclick="go(T)">إعادة المحاولة</button></p></div>'}window.addEventListener('error',e=>{try{msg('خطأ: '+(e.message||''))}catch(_){}});function an(){document.querySelectorAll('.k>div').forEach(e=>{const t=e.firstChild;if(!t||t.nodeType!=3)return;const v=parseFloat(t.textContent.replace(/,/g,''));if(!isFinite(v))return;const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/800);t.textContent=N(v*(1-Math.pow(1-p,3)))+' ';if(p<1)requestAnimationFrame(f)})(s)})}
function M(){const o={rev:0,cost:0,col:0,cash:0,exp:0,by:{},items:{},emp:{},cat:{},day:{}};
D.sales.forEach(s=>{if(s.st=='void')return;const X=tot(s);
if(inR(s.d)){o.rev+=X;o.day[s.d]=(o.day[s.d]||0)+X;s.it.forEach(i=>{o.cost+=i.q*i.c;const x=o.items[i.n]=o.items[i.n]||{q:0,v:0};x.q+=i.q;x.v+=i.q*i.p;x.g=(x.g||0)+i.q*(i.p-i.c)});const e=o.emp[s.e||'—']=o.emp[s.e||'—']||{n:0,v:0};e.n++;e.v+=X}
s.pays.forEach(p=>{if(inR(p.d)){o.col+=p.a;o.by[p.m]=(o.by[p.m]||0)+p.a;if(p.m=='cash')o.cash+=p.a}})});
D.exp.forEach(x=>{if(inR(x.d)){o.exp+=x.a;o.cat[x.c]=(o.cat[x.c]||0)+x.a;if(x.m=='cash')o.cash-=x.a}});
o.gp=o.rev-o.cost;o.net=o.gp-o.exp;o.out=D.sales.reduce((a,s)=>a+(s.st=='void'?0:tot(s)-paid(s)),0);return o}
const K=(l,v,c)=>`<div class="k"><small>${l}</small><div class="${c||''}">${N(v)} <small>${E(D.cur)}</small></div></div>`;
const cl=v=>v<0?'neg':'pos',low=()=>D.prd.filter(p=>p.s<=p.m);
const V={
dash(){const m=M(),L=low(),rec=D.sales.slice(-5).reverse();let days=[];for(let i=6;i>=0;i--){const d=iso(new Date(ld()-i*864e5));let r=0,x=0;D.sales.forEach(s=>{if(s.d==d&&s.st!='void')r+=tot(s)});D.exp.forEach(e=>{if(e.d==d)x+=e.a});days.push([d.slice(5),r,x])}
const mx=Math.max(1,...days.flatMap(d=>[d[1],d[2]]));
return `<div class="kp">${K('الإيرادات',m.rev)}${K('المحصّل',m.col)}${K('المصروفات',m.exp)}${K('مجمل الربح',m.gp,cl(m.gp))}${K('صافي الربح',m.net,cl(m.net))}${K('ذمم العملاء (غير محصّل)',m.out,m.out>0?'neg':'')}${K('صافي النقد بالصندوق',m.cash,cl(m.cash))}<div class="k"><small>تنبيهات المخزون</small><div class="${L.length?'neg':''}">${L.length}</div></div></div>
<div class="g2"><div class="card"><h3>آخر 7 أيام <small>(أخضر: إيراد • برتقالي: مصروف)</small></h3><div class="ch">${days.map(d=>`<div class="cl"><div class="bs"><i style="height:${d[1]/mx*100}%;background:var(--p)"></i><i style="height:${d[2]/mx*100}%;background:var(--a)"></i></div><small>${d[0]}</small></div>`).join('')}</div></div>
<div class="card"><h3>مخزون منخفض</h3>${L.length?L.map(p=>`<div>${E(p.n)} — <b class="neg">${p.s}</b></div>`).join(''):'<small>لا توجد تنبيهات</small>'}</div></div>
<div class="card"><h3>آخر العمليات</h3>${rec.length?`<div class="w"><table><tr><th>#</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th></tr>${rec.map(s=>`<tr><td>${s.id}</td><td>${s.d}</td><td>${E(s.cn||'—')} ${E(s.cp)}</td><td>${N(tot(s))}${s.st=='void'?' <small>(ملغاة)</small>':''}</td></tr>`).join('')}</table></div>`:'<small>لا توجد عمليات بعد. ابدأ بإنشاء فاتورة جديدة.</small>'}</div>`},
pos(){const em=`<option value="">—</option>${D.emp.map(e=>`<option>${E(e.n)}</option>`).join('')}`;
return `<div class="card"><h3>⚡ بيع سريع</h3><small>اضغط على الخدمة أو المنتج فتُسجَّل مباشرة في المبيعات بسعرها المحفوظ (كمية 1).</small><div class="row" style="margin:10px 0"><label>الدفع<select id="qm"><option value="cash">نقدي</option><option value="card">بطاقة</option></select></label><label>الموظف<select id="qe">${em}</select></label><label>اسم العميل (اختياري)<input id="qn"></label></div><div class="qg" id="qg">${qg()}</div></div>
<div class="card"><h3>فاتورة جديدة (عدة بنود)</h3><div class="row"><label>اسم العميل<input id="cn"></label><label>جوال العميل (اختياري)<input id="cp" inputmode="tel"></label><label>الموظف<select id="ce">${em}</select></label></div>
