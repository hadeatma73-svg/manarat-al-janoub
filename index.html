<style>

[data-view=mobile] #app{max-width:560px;margin:0 auto;box-shadow:0 0 0 1px var(--b)}
</style>

<body>
<div id='splash' onclick="this.classList.add('h')"><div class='bub'><i style='--x:10%;--s:14px;--d:3s'></i><i style='--x:30%;--s:22px;--d:4s'></i><i style='--x:55%;--s:12px;--d:2.6s'></i><i style='--x:75%;--s:26px;--d:4.4s'></i><i style='--x:90%;--s:16px;--d:3.4s'></i></div><div class='car'>🚗</div><h1>منارة الجنوب</h1><p>غسيل • زيوت • بنشر • خدمات</p></div>
<div id="app">
<header><div class='bub'><i style='--x:8%;--s:12px;--d:5s'></i><i style='--x:25%;--s:20px;--d:7s'></i><i style='--x:48%;--s:10px;--d:4.5s'></i><i style='--x:66%;--s:18px;--d:6s'></i><i style='--x:85%;--s:14px;--d:5.5s'></i></div>
<div class="hd"><div class="lg">منارة الجنوب<small>إدارة المحل</small></div><div class="hr"><span id='sy' onclick='if(sb&&!UID)showLogin()'>● محلي فقط</span><button class="hb" id="vb" onclick="togView()" title="تبديل العرض">💻</button></div></div></header>
<div id="shell"><nav id="nv"></nav><main id="mn"></main></div>
</div>
<div id="ts"></div>
<div id="md" onclick="if(event.target==this)closeMd()"><div id="mdb"></div></div>
<div id='lg'><div class='card'><h3>🚗 منارة الجنوب — تسجيل الدخول</h3><label>البريد الإلكتروني<input id='le' type='email' autocomplete='username'></label><label>كلمة المرور<input id='lp' type='password' autocomplete='current-password'></label><div id='lm'></div><div class='row'><button onclick='auth(0)'>دخول</button><button class='gh' onclick='auth(1)'>إنشاء حساب</button></div><small>بياناتك تُحفظ وتتزامن تلقائياً بين كل أجهزتك.</small><p><a style='cursor:pointer;text-decoration:underline;color:var(--m)' onclick="$('#lg').style.display='none'">متابعة بدون حساب (الحفظ على هذا الجهاز فقط)</a></p></div></div>
<script>
/* ================= helpers & state ================= */
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),N=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:2}),r2=x=>Math.round((+x||0)*100)/100;
const ld=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4),iso=d=>d.toISOString().slice(0,10),TD=()=>iso(ld());
const addD=(d,n)=>iso(new Date(Date.parse(d+'T00:00:00Z')+n*864e5));
const PM={cash:'نقدي',card:'بطاقة',credit:'دين'},EC=['إيجار','كهرباء','ماء','إنترنت','رواتب','مستلزمات','مواد تنظيف','تسويق','نقل','أخرى'];
const WDN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let D=null;try{D=JSON.parse(localStorage.getItem('mj'))}catch(e){}
D=D||{};
function norm(d){['svc','prd','sales','exp','emp','cust','pu','att','adv','rx','dp'].forEach(k=>d[k]=Array.isArray(d[k])?d[k]:[]);d.cur=d.cur||'';d.seq=d.seq||100;d.shop=d.shop||'';d.sph=d.sph||'';
['bk','rw','cd','rem','cl'].forEach(k=>delete d[k]);
d.sales.forEach(s=>{s.it=s.it||[];s.pays=s.pays||[]});
if(!d.mc){d.sales.forEach(s=>{if(!s.cid&&(s.cn||s.cp)){let c=d.cust.find(x=>(s.cp&&x.ph==s.cp)||(!s.cp&&x.n==s.cn));if(!c){c={id:d.seq++,n:s.cn||s.cp,ph:s.cp||'',ob:0};d.cust.push(c)}s.cid=c.id}});d.mc=1}
d.cust.forEach(c=>{c.ob=+c.ob||0;c.ph=c.ph||''});d.emp.forEach(e=>{delete e.p});return d}
norm(D);
const tot=s=>s.it.reduce((a,i)=>a+i.q*i.p,0),paid=s=>s.pays.reduce((a,p)=>a+p.a,0),rem=s=>s.st=='void'?0:Math.max(0,r2(tot(s)-paid(s)));
const cu=id=>D.cust.find(c=>c.id==id),cdebt=id=>r2(((cu(id)||{}).ob||0)+D.sales.reduce((a,s)=>a+(s.cid==id?rem(s):0),0));
let R={k:'day',f:TD(),t:TD()},T='dash',C=[],SQ='',CQ='',CF=false,CD=null,AD=null;const inR=d=>d>=R.f&&d<=R.t;
function msg(t){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',2800)}
function sure(b,f){if(b.dataset.s){f();return}b.dataset.l=b.dataset.l||b.textContent;b.dataset.s=1;b.textContent='تأكيد؟';b.classList.add('rd');setTimeout(()=>{b.dataset.s='';b.textContent=b.dataset.l;b.classList.remove('rd')},3000)}
function openMd(t,h){$('#mdb').innerHTML=`<div class="mdh"><b>${E(t)}</b><button class="gh" onclick="closeMd()">✕</button></div>${h}`;$('#md').style.display='flex'}
function closeMd(){$('#md').style.display='none';$('#mdb').innerHTML=''}
function setR(k){const n=ld(),y=n.getUTCFullYear(),m=n.getUTCMonth();R.k=k;R.t=TD();if(k=='day')R.f=R.t;else if(k=='week')R.f=addD(R.t,-6);else if(k=='month')R.f=iso(new Date(Date.UTC(y,m,1)));else if(k=='year')R.f=iso(new Date(Date.UTC(y,0,1)));rs()}
const rangeBar=()=>`<div class="card"><div class="row"><label>الفترة<select onchange="setR(this.value)">${[['day','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['year','هذه السنة'],['x','مخصص']].map(o=>`<option value="${o[0]}"${R.k==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label><label>من<input type="date" value="${R.f}" onchange="R.f=this.value;R.k='x';rs()"></label><label>إلى<input type="date" value="${R.t}" onchange="R.t=this.value;R.k='x';rs()"></label></div></div>`;
const K=(l,v,c,nc)=>`<div class="k"><small>${l}</small><div class="${c||''}">${N(v)} ${nc?'':'<small>'+E(D.cur)+'</small>'}</div></div>`;
const cl=v=>v<0?'neg':'pos',low=()=>D.prd.filter(p=>p.s<=p.m);
function an(){document.querySelectorAll('.k>div').forEach(e=>{const t=e.firstChild;if(!t||t.nodeType!=3)return;const v=parseFloat(t.textContent.replace(/,/g,''));if(!isFinite(v)||Math.abs(v)>1e9)return;const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/700);t.textContent=N(v*(1-Math.pow(1-p,3)))+' ';if(p<1)requestAnimationFrame(f)})(s)})}
/* ---- view mode (auto / mobile / desktop) ---- */
const MV=()=>{try{return localStorage.getItem('mv')||'auto'}catch(e){return 'auto'}};
function applyView(){const m=MV(),w=window.innerWidth||800,v=m=='auto'?(w>=900?'desktop':'mobile'):m;document.documentElement.dataset.view=v;const vp=document.querySelector('meta[name=viewport]');if(vp)vp.content=(m=='desktop'&&Math.min(screen.width||w,w)<900)?'width=1200':'width=device-width,initial-scale=1,viewport-fit=cover';const b=$('#vb');if(b)b.textContent=v=='desktop'?'💻':'📱';return v}
function setView(v){try{localStorage.setItem('mv',v)}catch(e){}applyView();rs()}
function togView(){setView(document.documentElement.dataset.view=='desktop'?'mobile':'desktop')}
addEventListener('resize',()=>{if(MV()=='auto')applyView()});
/* ---- navigation ---- */
const TB=[['dash','🏠 الرئيسية'],['pos','🛒 البيع'],['sales','🧾 المبيعات'],['cus','👥 العملاء'],['svc','🧼 الخدمات'],['inv','📦 المخزون'],['buy','🚚 المشتريات'],['exp','💸 المصروفات'],['emp','👷 الموظفون'],['rep','📊 التقارير'],['set','⚙️ الإعدادات']];
function go(k){T=k;$('#nv').innerHTML=TB.map(t=>`<b class="${t[0]==k?'on':''}" onclick="go('${t[0]}')">${t[1]}</b>`).join('');try{$('#mn').innerHTML=V[k]();if(k=='pos')rc()}catch(e){fail(e)}window.scrollTo(0,0);const o=$('#nv .on');if(o&&o.scrollIntoView&&document.documentElement.dataset.view!='desktop')try{o.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}an()}
function rs(){if(T=='pos'){try{$('#qg').innerHTML=qg();refC();rc()}catch(e){}return}try{$('#mn').innerHTML=V[T]()}catch(e){fail(e)}an()}
function fail(e){console.error(e);$('#mn').innerHTML='<div class="card"><h3>تعذّر عرض الصفحة</h3><small>'+E(e&&e.message)+'</small><p><button onclick="go(T)">إعادة المحاولة</button></p></div>'}
window.addEventListener('error',e=>{try{msg('خطأ: '+(e.message||''))}catch(_){}});
/* ---- core numbers ---- */
function M(){const o={n:0,rev:0,cost:0,col:0,by:{},exp:0,items:{},emp:{},cat:{},day:{}};
D.sales.forEach(s=>{if(s.st=='void')return;if(inR(s.d)){const X=tot(s);o.n++;o.rev+=X;o.day[s.d]=(o.day[s.d]||0)+X;s.it.forEach(i=>{o.cost+=i.q*i.c;const x=o.items[i.n]=o.items[i.n]||{q:0,v:0,g:0};x.q+=i.q;x.v+=i.q*i.p;x.g+=i.q*(i.p-i.c)});const k=s.e||'—',e=o.emp[k]=o.emp[k]||{n:0,v:0};e.n++;e.v+=X}
s.pays.forEach(p=>{if(inR(p.d)){o.col+=p.a;o.by[p.m]=(o.by[p.m]||0)+p.a}})});
D.dp.forEach(p=>{if(inR(p.d)){o.col+=p.a;o.by[p.m]=(o.by[p.m]||0)+p.a}});
D.exp.forEach(x=>{if(inR(x.d)){o.exp+=x.a;o.cat[x.c]=(o.cat[x.c]||0)+x.a}});
o.gp=o.rev-o.cost;o.net=o.gp-o.exp;o.out=r2(D.cust.reduce((a,c)=>a+cdebt(c.id),0)+D.sales.reduce((a,s)=>a+(s.cid&&cu(s.cid)?0:rem(s)),0));return o}
function alerts(m){const a=[];if(m.net<0)a.push(['bad','خسارة في الفترة: '+N(-m.net)+' '+E(D.cur)]);

D.cust.forEach(c=>{const old=D.sales.filter(s=>s.cid==c.id&&rem(s)>0.001).map(s=>s.d).sort()[0];if(old&&old<addD(TD(),-30))a.push(['warn','دين متأخر أكثر من 30 يوم: '+E(c.n)+' ('+N(cdebt(c.id))+')'])});

async function saveFile(name,text,mime){try{const f=new File([text],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---- list builders ---- */
function sl(){const q=SQ.trim().toLowerCase();const L=D.sales.filter(s=>inR(s.d)&&(!q||(s.cn||'').toLowerCase().includes(q)||(s.cp||'').includes(q)||String(s.id)==q||s.it.some(i=>i.n.toLowerCase().includes(q)))).reverse().slice(0,300);
return L.length?`<div class="lst">${L.map(s=>{const r=rem(s),st=s.st=='void'?'<span class="bd st3">ملغاة</span>':r>0?'<span class="bd st0">دين '+N(r)+'</span>':'<span class="bd st2">مدفوعة</span>',by=[...new Set(s.pays.map(p=>PM[p.m]||p.m))].join('، ');return li('#'+s.id+' · '+s.d,E(s.cn||'بدون اسم')+(s.e?' · '+E(s.e):''),`<div style="grid-column:1/-1">${s.it.map(i=>E(i.n)+' ×'+i.q+' = '+N(i.q*i.p)).join('<br>')}</div>`+kvv('الإجمالي',N(tot(s))+' '+E(D.cur))+kvv('الحالة',st+(by?'<br><small>'+by+'</small>':'')),s.st=='void'?'':`<button class="gh" onclick="prt(${s.id})">🖨️</button><button class="gh" onclick="waS(${s.id})">واتساب</button><button class="gh" onclick="sure(this,()=>cx(${s.id}))">إلغاء</button>`)}).join('')}</div>`:none('لا توجد فواتير في هذه الفترة')}
function cusList(){const q=CQ.trim().toLowerCase();let L=D.cust.map(c=>({c,d:cdebt(c.id),t:D.sales.filter(s=>s.cid==c.id&&s.st!='void').reduce((a,s)=>a+tot(s),0)}));if(CF)L=L.filter(x=>x.d>0.001);if(q)L=L.filter(x=>x.c.n.toLowerCase().includes(q)||(x.c.ph||'').includes(q));L.sort((a,b)=>b.d-a.d||a.c.n.localeCompare(b.c.n,'ar'));
return L.length?`<div class="lst">${L.map(({c,d,t})=>li(E(c.n),E(c.ph),kvv('الحالة',d>0.001?'<span class="bd st3">عليه دين '+N(d)+'</span>':'<span class="bd st2">لا يوجد دين</span>')+kvv('إجمالي مشترياته',N(t)+' '+E(D.cur)),`${d>0.001?`<button onclick="payCu(${c.id})">تسديد</button>`:''}<button class="gh" onclick="stmt(${c.id})">كشف</button>${d>0.001&&c.ph?`<button class="gh" onclick="waDebt(${c.id})">تذكير</button>`:''}<button class="gh" onclick="editCu(${c.id})">تعديل</button><button class="gh" onclick="sure(this,()=>delCu(${c.id}))">حذف</button>`)).join('')}</div>`:none(D.cust.length?'لا نتائج':'لا يوجد عملاء بعد. أضف أول عميل من الأعلى.')}
/* ================= selling ================= */
function qpm(){$('#qcw').style.display=$('#qm').value=='credit'?'block':'none'}
function refC(){['qc','cc'].forEach(id=>{const e=$('#'+id);if(e){const v=e.value;e.innerHTML=cOpts();e.value=v}})}
function mkSale(cid,e,it,pays){const c=cu(cid);return {id:D.seq++,d:TD(),cid:cid||0,cn:c?c.n:'',cp:c?c.ph:'',e:e||'',st:'done',it,pays}}
function qs(t,id){const o=(t=='s'?D.svc:D.prd).find(x=>x.id==id);if(!o)return;const m=$('#qm').value,cid=+$('#qc').value||0;if(m=='credit'&&!cid)return msg('اختر العميل لتسجيل الدين');if(t=='p'&&o.s<1)return msg('المخزون خالٍ');const P=+o.p||0;if(t=='p')o.s-=1;
D.sales.push(mkSale(m=='credit'?cid:0,$('#qe').value,[{n:o.n,q:1,p:o.p,c:o.c,t,id:o.id}],(m!='credit'&&P>0)?[{d:TD(),a:P,m}]:[]));save();$('#qg').innerHTML=qg();refC();msg('تم بيع «'+o.n+'» بـ '+N(P)+' '+D.cur+' ('+PM[m]+')')}
function addC(){const v=$('#ci').value;if(!v)return msg('أضف خدمات أو منتجات أولاً');const t=v[0],id=+v.slice(1),o=(t=='s'?D.svc:D.prd).find(x=>x.id==id),q=Math.max(1,Math.floor(+$('#cq').value||1));if(!o)return;const ex=C.find(c=>c.t==t&&c.id==id);if(t=='p'&&o.s<(ex?ex.q:0)+q)return msg('الكمية المتوفرة '+o.s);if(ex)ex.q+=q;else C.push({t,id,n:o.n,q,p:o.p,c:o.c});rc()}
function rc(){const el=$('#cart');if(!el)return;const X=C.reduce((a,c)=>a+c.q*c.p,0);el.innerHTML=C.length?`<h3>سلة الفاتورة</h3><div class="w"><table><tr><th>البند</th><th>الكمية</th><th>السعر</th><th>المجموع</th><th></th></tr>${C.map((c,i)=>`<tr><td>${E(c.n)}</td><td>${c.q}</td><td>${N(c.p)}</td><td>${N(c.q*c.p)}</td><td><button class="gh" onclick="C.splice(${i},1);rc()">✕</button></td></tr>`).join('')}</table></div><h3>الإجمالي: ${N(X)} ${E(D.cur)}</h3><div class="row"><label>طريقة الدفع<select id="cm" onchange="cpm(${X})"><option value="cash">نقدي</option><option value="card">بطاقة</option><option value="credit">دين</option></select></label><label>المدفوع الآن<input id="cpd" type="number" min="0" step="any" value="${X}"></label><button onclick="saveS()">حفظ الفاتورة</button></div>${none('إذا دفع جزءاً فقط يُسجَّل الباقي ديناً على العميل المختار.')}`:none('أضف خدمة أو منتجاً لبدء الفاتورة')}
function cpm(X){$('#cpd').value=$('#cm').value=='credit'?0:X}
function saveS(){if(!C.length)return msg('الفاتورة فارغة');const X=r2(C.reduce((a,c)=>a+c.q*c.p,0)),m=$('#cm').value,cid=+$('#cc').value||0,P=r2(Math.min(X,Math.max(0,+$('#cpd').value||0))),left=r2(X-P);
if(left>0.001&&!cid)return msg('اختر العميل لتسجيل الدين ('+N(left)+')');
for(const c of C)if(c.t=='p'){const p=D.prd.find(x=>x.id==c.id);if(!p||p.s<c.q)return msg('المخزون تغيّر لـ '+c.n)}
C.forEach(c=>{if(c.t=='p')D.prd.find(x=>x.id==c.id).s-=c.q});
D.sales.push(mkSale(cid,$('#ce').value,C.map(c=>({n:c.n,q:c.q,p:c.p,c:c.c,t:c.t,id:c.id})),P>0?[{d:TD(),a:P,m:m=='credit'?'cash':m}]:[]));save();C=[];msg('تم حفظ الفاتورة');go('sales')}
function cx(id){const s=D.sales.find(x=>x.id==id);if(!s||s.st=='void')return;s.it.forEach(i=>{if(i.t=='p'){const p=D.prd.find(x=>x.id==i.id);if(p)p.s+=i.q}});s.st='void';save();rs();msg('تم إلغاء الفاتورة وإرجاع المخزون')}
function invTxt(s){const X=tot(s),P=paid(s);return (D.shop||'منارة الجنوب')+'\nفاتورة رقم '+s.id+' — '+s.d+(s.cn?'\nالعميل: '+s.cn:'')+'\n'+s.it.map(i=>i.n+' × '+i.q+' = '+N(i.q*i.p)).join('\n')+'\nالإجمالي: '+N(X)+' '+D.cur+(X-P>0.001?'\nالمتبقي (دين): '+N(X-P)+' '+D.cur:'')+'\nشكراً لزيارتكم'+(D.sph?'\nللتواصل: '+D.sph:'')}
function wipeAsk(){const n=D.sales.length;if(!n)return msg('لا توجد فواتير لحذفها');const dbt=D.sales.reduce((a,s)=>a+rem(s),0);openMd('حذف كل الفواتير',`<div class="al bad">سيتم حذف <b>${n}</b> فاتورة نهائياً من هذا الجهاز ومن السحابة، ولن يبقى لها أي أثر في المبيعات أو التقارير. لا يمكن التراجع.</div>${dbt>0.001?`<div class="al warn">ستختفي ديون العملاء الناتجة عن هذه الفواتير (${N(dbt)} ${E(D.cur)}). يبقى فقط «الدين السابق» المسجّل عند إضافة العميل.</div>`:''}<label class="ck"><input type="checkbox" id="wk" checked> إرجاع كميات المنتجات المباعة إلى المخزون</label><label>اكتب كلمة «حذف» للتأكيد<input id="wc" autocomplete="off"></label><div class="mx"><button class="gh" onclick="backup()">تنزيل نسخة احتياطية أولاً</button><button class="rd" onclick="wipeDo()">حذف نهائياً</button></div>`)}
async function wipeDo(){if(($('#wc').value||'').trim()!=='حذف')return msg('اكتب كلمة «حذف» للتأكيد');const back=$('#wk').checked;if(back)D.sales.forEach(s=>{if(s.st!='void')s.it.forEach(i=>{if(i.t=='p'){const p=D.prd.find(x=>x.id==i.id);if(p)p.s+=i.q}})});D.sales=[];save();closeMd();rs();msg('تم حذف كل الفواتير');if(sb&&UID){clearTimeout(tm);await push();try{await sb.rpc('purge_sale_mail')}catch(e){}}}
function waS(id){const s=D.sales.find(x=>x.id==id);if(s)wa(s.cp,invTxt(s))}
function prt(id){const s=D.sales.find(x=>x.id==id);if(!s)return;const X=tot(s),P=paid(s),w=window.open('','_blank');if(!w)return msg('اسمح بالنوافذ المنبثقة للطباعة');w.document.write(`<!doctype html><html dir="rtl"><meta charset="utf-8"><title>فاتورة ${s.id}</title><body style="font-family:Arial,sans-serif;max-width:420px;margin:auto;padding:16px"><h2 style="text-align:center;margin:0">${E(D.shop||'منارة الجنوب')}</h2><p style="text-align:center;margin:2px">${E(D.sph||'')}</p><hr><p>فاتورة رقم <b>${s.id}</b> — ${s.d}${s.cn?'<br>العميل: '+E(s.cn):''}</p><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:right">البند</th><th>الكمية</th><th>المجموع</th></tr>${s.it.map(i=>`<tr><td>${E(i.n)}</td><td style="text-align:center">${i.q}</td><td style="text-align:center">${N(i.q*i.p)}</td></tr>`).join('')}</table><hr><p><b>الإجمالي: ${N(X)} ${E(D.cur)}</b>${X-P>0.001?'<br>المتبقي: '+N(X-P)+' '+E(D.cur):''}</p><p style="text-align:center">شكراً لزيارتكم</p><script>setTimeout(function(){print()},300)<\/script></body></html>`);w.document.close()}
/* ================= customers & debts ================= */
function newCust(sel){openMd('عميل جديد',`<label>الاسم<input id="mc_n"></label><label>الجوال (اختياري)<input id="mc_p" inputmode="tel"></label><label>دين سابق (اختياري)<input id="mc_o" type="number" min="0" step="any"></label><button onclick="saveCu('${sel||''}')">حفظ</button>`)}
function saveCu(sel,id){const n=$('#mc_n').value.trim(),ph=$('#mc_p').value.trim(),ob=Math.max(0,r2(+$('#mc_o').value||0));if(!n)return msg('اكتب اسم العميل');if(ph&&D.cust.some(c=>c.ph==ph&&c.id!=id))return msg('هذا الرقم مسجّل لعميل آخر');
if(id){const c=cu(id);c.n=n;c.ph=ph;c.ob=ob;D.sales.forEach(s=>{if(s.cid==id){s.cn=n;s.cp=ph}})}else{const c={id:D.seq++,n,ph,ob};D.cust.push(c);id=c.id}
save();closeMd();if(sel){refC();const e=$('#'+sel);if(e)e.value=id}else rs();msg('تم الحفظ')}
function addCu(){const n=$('#an_n').value.trim(),ph=$('#an_p').value.trim(),ob=Math.max(0,r2(+$('#an_o').value||0));if(!n)return msg('اكتب اسم العميل');if(ph&&D.cust.some(c=>c.ph==ph))return msg('هذا الرقم مسجّل لعميل آخر');D.cust.push({id:D.seq++,n,ph,ob});save();rs();msg('تمت إضافة العميل')}
function editCu(id){const c=cu(id);if(!c)return;openMd('تعديل عميل',`<label>الاسم<input id="mc_n" value="${E(c.n)}"></label><label>الجوال<input id="mc_p" inputmode="tel" value="${E(c.ph)}"></label><label>الدين السابق المتبقي (غير الفواتير)<input id="mc_o" type="number" min="0" step="any" value="${c.ob||0}"></label><button onclick="saveCu('',${id})">حفظ</button>`)}
function payCu(id){const c=cu(id),d=cdebt(id);if(!c||d<=0.001)return;openMd('تسديد دين: '+c.n,`<p>الدين الحالي: <b class="neg">${N(d)} ${E(D.cur)}</b></p><label>المبلغ<input id="mp_a" type="number" min="0" step="any" value="${d}"></label><label>طريقة الدفع<select id="mp_m"><option value="cash">نقدي</option><option value="card">بطاقة</option></select></label><button onclick="doPay(${id})">تسجيل الدفعة</button>`)}
function doPay(id){const d=cdebt(id),a=r2(Math.min(d,+$('#mp_a').value||0));if(!(a>0))return msg('أدخل مبلغاً صحيحاً');const m=$('#mp_m').value;let left=a;
D.sales.filter(s=>s.cid==id&&rem(s)>0.001).sort((x,y)=>x.d.localeCompare(y.d)||x.id-y.id).forEach(s=>{if(left<=0.001)return;const p=r2(Math.min(rem(s),left));s.pays.push({d:TD(),a:p,m});left=r2(left-p)});
if(left>0.001){const c=cu(id),p=r2(Math.min(c.ob||0,left));if(p>0){c.ob=r2(c.ob-p);D.dp.push({id:D.seq++,cid:id,d:TD(),a:p,m});left=r2(left-p)}}
save();closeMd();rs();msg('تم تسجيل دفعة '+N(a)+' '+D.cur)}
function stmt(id){const c=cu(id);if(!c)return;const L=D.sales.filter(s=>s.cid==id&&s.st!='void').sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);openMd('كشف حساب: '+c.n,`<p>${E(c.ph)} — الدين الحالي: <b class="${cdebt(id)>0.001?'neg':'pos'}">${N(cdebt(id))} ${E(D.cur)}</b></p>${c.ob>0?`<div class="al warn">دين سابق متبقٍ: ${N(c.ob)}</div>`:''}${L.length?`<div class="w"><table><tr><th>#</th><th>التاريخ</th><th>الإجمالي</th><th>المتبقي</th></tr>${L.map(s=>`<tr><td>${s.id}</td><td>${s.d}</td><td>${N(tot(s))}</td><td class="${rem(s)>0?'neg':''}">${N(rem(s))}</td></tr>`).join('')}</table></div>`:none('لا فواتير لهذا العميل')}`)}
function waDebt(id){const c=cu(id);if(c)wa(c.ph,'مرحباً '+c.n+'، نذكّرك بأن عليك مبلغ '+N(cdebt(id))+' '+D.cur+' لدى '+(D.shop||'منارة الجنوب')+'. شكراً لتعاونك.')}
function delCu(id){if(cdebt(id)>0.001)return msg('لا يمكن حذف عميل عليه دين');D.cust=D.cust.filter(c=>c.id!=id);D.sales.forEach(s=>{if(s.cid==id)s.cid=0});save();rs();msg('تم حذف العميل')}
/* ================= catalog / stock ================= */
function addS(){const n=$('#sn').value.trim(),p=+$('#sp').value;if(!n||!(p>0))return msg('اكتب اسم الخدمة وسعرها');D.svc.push({id:D.seq++,n,p,c:+$('#sc').value||0});save();rs();msg('تمت إضافة الخدمة')}
function addP(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!(p>0))return msg('اكتب اسم المنتج وسعر البيع');D.prd.push({id:D.seq++,n,p,c:+$('#pc').value||0,s:Math.max(0,Math.floor(+$('#ps').value||0)),m:Math.max(0,Math.floor(+$('#pm').value||0))});save();rs();msg('تمت إضافة المنتج')}
function rst(id){const p=D.prd.find(x=>x.id==id),q=Math.floor(+$('#rq'+id).value||0);if(!p||!(q>0))return msg('اكتب الكمية');p.s+=q;save();rs();msg('تم التوريد')}
function upd(k,id,f,v){const o=D[k].find(x=>x.id==id);if(!o)return;o[f]=Math.max(0,+v||0);save();msg('تم الحفظ')}
function del(k,id){D[k]=D[k].filter(x=>x.id!=id);save();rs();msg('تم الحذف')}
function addU(){const p=D.prd.find(x=>x.id==$('#up').value),q=Math.floor(+$('#uq').value||0),v=$('#uc').value,c=+v;if(!p||q<1||v===''||!(c>=0))return msg('أدخل الكمية وتكلفة الوحدة');p.s+=q;p.c=c;D.pu.push({id:D.seq++,d:TD(),sup:$('#us').value.trim(),pid:p.id,n:p.n,q,c,a:r2(q*c),m:$('#um').value});save();rs();msg('تم تسجيل الشراء وتحديث المخزون')}
function delU(id){const x=D.pu.find(y=>y.id==id);if(!x)return;const p=D.prd.find(y=>y.id==x.pid);if(p)p.s=Math.max(0,p.s-x.q);D.pu=D.pu.filter(y=>y.id!=id);save();rs();msg('تم حذف الشراء وتعديل المخزون')}
/* ================= expenses ================= */
function addX(){const a=+$('#xa').value;if(!(a>0))return msg('أدخل المبلغ');D.exp.push({id:D.seq++,d:$('#xd').value||TD(),c:$('#xc').value,a,m:$('#xm').value,t:$('#xt').value.trim()});save();rs();msg('تم حفظ المصروف')}
const pmon=ym=>{let[y,m]=ym.split('-').map(Number);m--;if(!m){m=12;y--}return y+'-'+String(m).padStart(2,'0')},nmon=ym=>{let[y,m]=ym.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
function addRx(){const a=+$('#ra').value;if(!(a>0))return msg('أدخل المبلغ');D.rx.push({id:D.seq++,c:$('#rc').value,a,day:Math.min(28,Math.max(1,+$('#rdy').value||1)),m:$('#rpm').value,t:$('#rtx').value.trim(),from:TD().slice(0,7),last:''});runRx();save();rs();msg('تمت إضافة المصروف الثابت')}
function runRx(){const t=TD(),cm=t.slice(0,7);D.rx.forEach(r=>{let m=r.last?nmon(r.last):r.from;while(m<=cm){const d=m+'-'+String(r.day).padStart(2,'0');if(d>t)break;D.exp.push({id:D.seq++,d,c:r.c,a:r.a,m:r.m||'card',t:(r.t||r.c)+' (ثابت)'});r.last=m;m=nmon(m)}})}
const mo=ym=>{let r=0,c=0,e=0,n=0;D.sales.forEach(s=>{if(s.st!='void'&&s.d.startsWith(ym)){n++;r+=tot(s);s.it.forEach(i=>c+=i.q*i.c)}});D.exp.forEach(x=>{if(x.d.startsWith(ym))e+=x.a});return{r,c,e,n,net:r-c-e}};
/* ================= employees ================= */
function addE(){const n=$('#en').value.trim();if(!n)return msg('اكتب اسم الموظف');D.emp.push({id:D.seq++,n,r:$('#er').value.trim(),b:+$('#eb').value||0});save();rs();msg('تمت إضافة الموظف')}
function setAt(eid,st){const d=AD||TD();D.att=D.att.filter(a=>!(a.eid==eid&&a.d==d));D.att.push({id:D.seq++,eid,d,s:st});save();rs()}
function addV(){const a=+$('#va').value;if(!(a>0))return msg('أدخل مبلغ السلفة');D.adv.push({id:D.seq++,eid:+$('#ve').value,d:TD(),a,t:$('#vt').value.trim()});save();rs();msg('تم تسجيل السلفة')}
/* ================= export / backup ================= */
const csv=rows=>'\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
function exportCSV(){const rows=[['رقم','التاريخ','العميل','الجوال','الموظف','الحالة','البنود','الإجمالي','المدفوع','المتبقي']];D.sales.filter(s=>inR(s.d)).forEach(s=>rows.push([s.id,s.d,s.cn||'',s.cp||'',s.e||'',s.st=='void'?'ملغاة':'مكتملة',s.it.map(i=>i.n+'×'+i.q).join(' | '),tot(s),paid(s),rem(s)]));saveFile('sales_'+R.f+'_'+R.t+'.csv',csv(rows),'text/csv;charset=utf-8');msg('تم تجهيز ملف المبيعات')}
function exportExp(){const rows=[['التاريخ','الفئة','الوصف','الدفع','المبلغ']];D.exp.filter(x=>inR(x.d)).forEach(x=>rows.push([x.d,x.c,x.t||'',PM[x.m]||'',x.a]));saveFile('expenses_'+R.f+'_'+R.t+'.csv',csv(rows),'text/csv;charset=utf-8');msg('تم تجهيز ملف المصروفات')}
function backup(){saveFile('manarat-backup-'+TD()+'.json',JSON.stringify(D),'application/json');msg('تم تجهيز النسخة الاحتياطية')}
function imp(t){let j;try{j=JSON.parse(t)}catch(e){return msg('الملف غير صالح')}if(!j||!Array.isArray(j.sales))return msg('ليس ملف نسخة احتياطية من التطبيق');if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة. متابعة؟'))return;D=norm(j);save();go('set');msg('تم استرجاع النسخة')}
function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f);i.value=''}
/* ================= account, sync, e-mail settings ================= */
const SB_URL='https://fnjckzfvxmmwyiafwqmj.supabase.co',SB_KEY='sb_publishable_EIpKLCJFANTsYhzBe3u3lg_x6aJDAjc';
let sb=null,REV=-1,UID=null,tm=null,dirty=false,OUT=false,MAIL={to:'',tz:'Asia/Amman',daily:true,weekly:true};
const DEV=(()=>{try{let v=localStorage.getItem('mdev');if(!v){v=Math.random().toString(36).slice(2);localStorage.setItem('mdev',v)}return v}catch(e){return 'x'}})();
const save=()=>{try{localStorage.setItem('mj',JSON.stringify(D))}catch(e){}dirty=true;clearTimeout(tm);tm=setTimeout(()=>push(),700)};
const ss=(t,c)=>{const e=$('#sy');if(e){e.textContent=t;e.style.color=c||''}},lm=t=>$('#lm').textContent=t,cnt=d=>['sales','exp','emp','cust','svc','prd','pu'].reduce((a,k)=>a+((d&&d[k])||[]).length,0);
const adopt=(d,r)=>{D=norm(d);runRx();REV=r;try{localStorage.setItem('mj',JSON.stringify(D))}catch(e){}};
async function push(){if(!sb||!UID)return;ss('جارٍ الحفظ…');const r=await sb.from('shop_state').upsert({user_id:UID,data:Object.assign({},D,{_by:DEV,_at:Date.now()})}).select('rev').single();if(r.error){dirty=true;ss('● غير متصل — سيُعاد الحفظ تلقائياً','#fca5a5');return}dirty=false;REV=r.data.rev;ss('● متزامن','#86efac')}
function showLogin(){$('#lg').style.display='flex';ss('غير مسجّل','#fcd34d')}
async function auth(up){const e=$('#le').value.trim(),p=$('#lp').value;if(!e||p.length<6)return lm('أدخل بريداً وكلمة مرور (6 أحرف فأكثر)');const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return lm(r.error.message);if(r.data.session)boot(r.data.user);else lm('تم إنشاء الحساب. افتح رابط التأكيد في بريدك ثم سجّل الدخول.')}
async function out(){OUT=true;try{if(sb)await sb.auth.signOut()}catch(e){}UID=null;showLogin();OUT=false}
async function boot(u){UID=u.id;$('#lg').style.display='none';lm('');ss('جارٍ المزامنة…');const r=await sb.from('shop_state').select('data,rev,notify_email,tz,daily_on,weekly_on').eq('user_id',UID).maybeSingle();if(r.error){ss('● غير متصل','#fca5a5');return}
if(r.data)MAIL={to:r.data.notify_email||'',tz:r.data.tz||'Asia/Amman',daily:r.data.daily_on!==false,weekly:r.data.weekly_on!==false};
const rd=r.data&&r.data.data;if(rd&&Array.isArray(rd.sales)&&(cnt(rd)>0||cnt(D)==0)){const before=JSON.stringify(rd);adopt(rd,r.data.rev);if(JSON.stringify(D)!=before)save();go(T)}else{if(r.data)REV=r.data.rev;await push()}
ss('● متزامن','#86efac');if(T=='set')rs();
sb.channel('ss-'+UID).on('postgres_changes',{event:'*',schema:'public',table:'shop_state',filter:'user_id=eq.'+UID},p=>{try{const n=p.new;if(!n||!n.data)return;if(n.data._by===DEV){REV=Math.max(REV,n.rev);return}if(n.rev>REV&&Array.isArray(n.data.sales)){adopt(n.data,n.rev);if(T=='pos')rs();else go(T);ss('● تم التحديث','#86efac')}}catch(e){console.error(e)}}).subscribe()}
async function saveMail(p){if(!sb||!UID)return msg('سجّل الدخول أولاً');const r=await sb.from('shop_state').update(p).eq('user_id',UID);if(r&&r.error)return msg('تعذّر الحفظ');if('notify_email' in p)MAIL.to=p.notify_email||'';if('tz' in p)MAIL.tz=p.tz;if('daily_on' in p)MAIL.daily=p.daily_on;if('weekly_on' in p)MAIL.weekly=p.weekly_on;msg('تم الحفظ')}
async function mailNow(k){if(!sb||!UID)return msg('سجّل الدخول أولاً');const v=($('#ne')||{}).value;if(v!==undefined&&v.trim()!==MAIL.to)await saveMail({notify_email:v.trim()||null});if(!MAIL.to)return msg('اكتب بريد الاستلام أولاً');msg('جارٍ الإرسال…');await push();const r=await sb.functions.invoke('shop-mail',{body:{action:k}}),d=r.data;if(r.error&&!d)return msg('تعذّر الاتصال بخدمة البريد');msg(d&&d.message?d.message:(d&&d.ok?'تم الإرسال':'تعذّر الإرسال'))}
async function sbInit(){if(!window.supabase){ss('● محلي فقط');return}sb=supabase.createClient(SB_URL,SB_KEY);sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'){UID=null;try{sb.removeAllChannels()}catch(e){}if(OUT){OUT=false;showLogin()}else ss('● انتهت الجلسة (اضغط هنا لتسجيل الدخول)','#fcd34d')}});const g=await sb.auth.getSession();if(g.data.session)boot(g.data.session.user);else showLogin();window.addEventListener('online',()=>dirty&&push());setInterval(()=>dirty&&push(),30000)}
/* ================= start ================= */
applyView();runRx();try{localStorage.setItem('mj',JSON.stringify(D))}catch(e){}
go('dash');setTimeout(()=>{const e=$('#splash');e&&e.classList.add('h')},2600);setTimeout(()=>{const e=$('#splash');e&&e.remove()},3600);sbInit();
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
